services:
  - type: web
    name: soft3tt-conversion-api
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MAX_FILE_MB
        value: "500"
      - key: JOB_TTL_MINUTES
        value: "60"
      - key: PUBLIC_BASE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://www.soft3tt.online,https://soft3tt.online
